# Secret-scan config (YED-304; shared across PRs #270/#272 — one config, whichever PR merges
# first lands it; the other rebases onto it). Extends the default gitleaks rule set with ONE
# allowlist for fixture digests. Path-scoped, NOT commit-pinned — .gitleaksignore fingerprints
# embed the commit SHA and break on squash merge (verified in PR #272's review scratch squash:
# secret-scan goes red on main).
#
# condition = "AND" requires BOTH the path to match AND the finding's secret to be exactly
# 64 hex chars (a sha256 digest of a public *.example URL) before the allowlist applies:
# any other secret-shaped value inside supabase/fixtures/ — e.g. a planted sk_live_ token —
# is still flagged (verified 2026-11-04 in scratch probes and against this config, gitleaks
# 8.30.1, `gitleaks git` mode — the mode CI's secret-scan.yml runs, per its line 29).
#
# KNOWN LIMITATION (verified 2026-11-04, debug logs): in `gitleaks dir` mode (ad-hoc local
# working-tree scans, NOT what CI uses) a global allowlist's `paths` skips matched files
# BEFORE any content evaluation, in scalar or array form — inside such files nothing is
# value-checked. Verify allowlist changes with `gitleaks git --log-opts=...`, never `dir`.
[extend]
useDefault = true

[[allowlists]]
description = "synthetic fixtures: sha256 digests of public *.example URLs (feeds.item_key / cluster source keys), not credentials"
condition = "AND"
paths = ['''(^|/)supabase/fixtures/''']
regexes = ['''(?i)^[0-9a-f]{64}$''']
