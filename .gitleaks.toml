# Secret-scan config (YED-304; shared across PRs #270/#272 — one config, whichever PR merges
# first lands it; the other rebases onto it). Extends the default gitleaks rule set with ONE
# allowlist for fixture digests. Path-scoped, NOT commit-pinned — .gitleaksignore fingerprints
# embed the commit SHA and break on squash merge (verified in PR #272's review scratch squash:
# secret-scan goes red on main).
#
# WHY NOT condition = "AND" (re-review 2026-11-04, PR #272 debug logs; verified in 8.30.1):
# a global allowlist with `paths` makes gitleaks SKIP matched files before any content is
# read (`DBG skipping file: global allowlist path=...`), so value-scoping (regexes +
# condition = "AND") never applies at the global level. Two forms work:
#   (a) paths-only — blanket-exempt exact files (CHOSEN): the exempt surface is exactly the
#       four synthetic subagent fixture files whose only credential-shaped content is sha256
#       digests of public *.example URLs (feeds.item_key);
#   (b) regexes-only — exempt findings whose secret is exactly 64 hex chars repo-wide, which
#       would silently ignore a REAL 64-hex API key anywhere in the codebase (worse trade).
# The paths below are pinned to the exact fixture files — every other file, including any new
# file under supabase/fixtures/, is scanned in full. If a non-digest secret ever needs to live
# in one of these files, the fix is to move it out, never to widen this allowlist.
# `classified_*` is the pre-review fixture generation — it exists only in this branch's
# history (renamed to `subagent_*` in 43c628a) and carries the SAME four digests; the pin
# covers it so the range scan stays green. After squash it matches nothing and is inert.
[extend]
useDefault = true

[[allowlists]]
description = "synthetic subagent fixtures: sha256 digests of public *.example URLs (feeds.item_key), not credentials"
paths = '''(^|/)supabase/fixtures/feed_classifier/(classified|subagent)_(confidential|launch|market|pii_email)\.json$'''
