# Secret + private-file scan (YED-259). Both repos are public (CLAUDE.md invariant 4): a leaked key or a
# committed private reference is publishing it. Runs on every PR and push to main; a hit fails the check.
# gitleaks is pinned and downloaded directly (no third-party action). Reviewed false positives live in
# .gitleaksignore by fingerprint.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
      - name: gitleaks (commits in this PR, or the pushed range)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            case "${{ github.event.before }}" in 0000000000000000000000000000000000000000) RANGE="-1";; esac
          fi
          /tmp/gitleaks git --redact --no-banner --log-opts="$RANGE" .
      - name: Private files never tracked (invariant 4)
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..+)?|me-model\.md|target-companies\.md|inbox-allowlist\.md|inbox-denylist\.md)$' | grep -v '\.env\.example$'; then
            echo "::error::a private file is tracked (see CLAUDE.md invariant 4)"; exit 1
          fi
