# Trial only (YED-352), never merged: a PR-added workflow trying to read the factory
# secrets. It prints whether each one is present, never a value. Expected: empty at
# repo level, and both environment jobs refused because only main may deploy.
name: zz-secret-probe
on:
  pull_request:
  pull_request_target:
permissions: {}
jobs:
  repo-level:
    runs-on: ubuntu-24.04
    steps:
      - name: Presence only
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
          APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          BLOCKLIST: ${{ secrets.FACTORY_NAME_BLOCKLIST }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for v in APP_ID APP_KEY BLOCKLIST CLAUDE_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v present"; else echo "$v empty"; fi
          done
  decide-env:
    runs-on: ubuntu-24.04
    environment: factory-decide
    steps:
      - name: Presence only
        env:
          APP_ID: ${{ secrets.FACTORY_APP_ID }}
          APP_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          BLOCKLIST: ${{ secrets.FACTORY_NAME_BLOCKLIST }}
        run: |
          for v in APP_ID APP_KEY BLOCKLIST; do
            if [ -n "${!v}" ]; then echo "$v present"; else echo "$v empty"; fi
          done
  review-env:
    runs-on: ubuntu-24.04
    environment: factory-review
    steps:
      - name: Presence only
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$CLAUDE_TOKEN" ]; then echo "CLAUDE_TOKEN present"; else echo "CLAUDE_TOKEN empty"; fi
