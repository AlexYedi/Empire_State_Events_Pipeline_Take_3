# Copy to .github/workflows/factory-gate.yml. Replace CORE_SHA in both places and
# alexyedi-factory. pull_request_target takes this file from the base branch, so a
# PR cannot edit the gate that judges it.
name: factory-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: factory-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  factory-gate:
    uses: AlexYedi/alex-factory/.github/workflows/gate.yml@89ed598dc9914a982258ab7622a11c0e22080272
    with:
      core_sha: 89ed598dc9914a982258ab7622a11c0e22080272
      app_slug: alexyedi-factory
    secrets: inherit
