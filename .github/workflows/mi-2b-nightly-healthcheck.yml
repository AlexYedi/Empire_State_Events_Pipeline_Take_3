name: MI topic-intelligence nightly (compute + health-check)

# Nightly topic-intelligence refresh for the consolidated MI graph (YED-230 / YED-131).
#   1. COMPUTE — supabase/scripts/topic_intel_compute.py --apply: a read-only parity gate (the
#      ported SQL must reproduce healthcheck_2b.py's independent reference exactly), then
#      `set role pipeline_writer; select topic_intelligence.compute_topic_intelligence(today)`.
#      Refuses to write on any mismatch. Needs migration 0012 applied.
#   2. HEALTH-CHECK — supabase/scripts/healthcheck_2b.py (read-only): stored snapshot vs the
#      independent recompute + the 8 structural invariants + the anon read-path probe.
# Before 2026-09-28 only step 2 ran and nothing recomputed, so the stored snapshot froze at the
# 2026-08-10 cutover and step 2 failed every night on staleness (#80 … #140).
#
# REQUIRED repo secrets (Settings > Secrets and variables > Actions):
#   MI_DB_DSN            The SESSION POOLER connection string (IPv4 — GitHub runners can't reach
#                        the IPv6-only direct db.<ref>.supabase.co host). From Supabase dashboard
#                        > Connect > Session pooler, e.g.:
#                        postgres://postgres.oicikjyzmxqfomrrqkvf:<PW>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   MI_SUPABASE_URL      https://oicikjyzmxqfomrrqkvf.supabase.co
#   MI_SUPABASE_ANON_KEY the publishable/anon key
#
# NOTE: scheduled workflows only fire from the DEFAULT branch — this activates once it's on main.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly (~04:00 ET)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: mi-topic-intel-nightly
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql (libpq client)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Compute topic intelligence (parity-gated write via pipeline_writer)
        env:
          MI_DB_DSN: ${{ secrets.MI_DB_DSN }}
          PSQL_BIN: psql
        run: python3 supabase/scripts/topic_intel_compute.py --apply --runtime github_actions
      - name: Run MI 2b health-check
        env:
          MI_DB_DSN: ${{ secrets.MI_DB_DSN }}
          MI_SUPABASE_URL: ${{ secrets.MI_SUPABASE_URL }}
          MI_SUPABASE_ANON_KEY: ${{ secrets.MI_SUPABASE_ANON_KEY }}
          PSQL_BIN: psql
        run: python3 supabase/scripts/healthcheck_2b.py
      # One open issue, not one per night (2026-09-27): a failure that persists used to open a new issue every
      # run — 9 in 9 nights (#80…#140) for a single cause (YED-230). Now: if an open "MI 2b health-check FAILED"
      # issue exists, add tonight's run as a comment on it; open a new issue only when none is open (i.e. the
      # first failure after the last one was closed). Closing that issue re-arms the alert.
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          OPEN=$(gh issue list --state open --search "MI 2b health-check FAILED in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still failing on $TODAY. Run: $RUN_URL" \
              || echo "issue-comment failed; check the Actions run directly"
          else
            gh issue create \
              --title "MI 2b health-check FAILED (since $TODAY)" \
              --body "The nightly topic-intelligence job failed — either the compute refused to write (ported SQL disagreed with the reference, or the write errored) or the health-check found the stored graph incoherent. The failing step in the run says which. Run: $RUN_URL. Later failures are added as comments here until this issue is closed. The pre2b rollback (\`supabase/staging/2b_rollback.sql\`, ~1.3s, proven) remains available. YED-130." \
              || echo "issue-create failed; check the Actions run directly"
          fi
