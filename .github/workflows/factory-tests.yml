# Copy to .github/workflows/factory-tests.yml. Replace 5a9753e548abba91c504feef10967b795805a05b in both places.
# Runs PR code, so it is assumed hostile: no secrets are passed, and no
# `secrets: inherit`, ever.
name: factory-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  factory-tests:
    uses: AlexYedi/alex-factory/.github/workflows/tests.yml@5a9753e548abba91c504feef10967b795805a05b
    with:
      core_sha: 5a9753e548abba91c504feef10967b795805a05b
